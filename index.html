<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindGraph X - AI Knowledge Graph & Intelligence System</title>
    <meta name="description" content="An AI-powered personal knowledge graph and learning intelligence system with forgetting estimation, bottleneck discovery, and grounded mentoring." />
    <meta property="og:title" content="MindGraph X - AI Knowledge Graph & Intelligence System" />
    <meta property="og:description" content="An AI-powered personal knowledge graph and learning intelligence system with forgetting estimation, bottleneck discovery, and grounded mentoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('mindgraph_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored === 'light' || stored === 'dark' ? stored : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.className = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.className = 'dark';
        }
      })();
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary antialiased selection:bg-accent-purple/30 selection:text-accent-purple-light min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
